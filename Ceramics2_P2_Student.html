function closeExLightbox(){document.getElementById("ex-lightbox").classList.remove("on");}

function quizDone0(){return quiz0Passed();}

function renderUnit0(){
  const panel=document.getElementById("wpanel");if(!panel)return;
  if(!isUnlocked(0)){
    panel.innerHTML=`<div class="panel"><div class="lock-notice">🔒 This unit is currently locked by your teacher. Check back when it's opened!</div></div>`;
    panel.scrollIntoView({behavior:"smooth",block:"nearest"});return;
  }
  if(!tabState[0])tabState[0]="lesson";
  const tab=tabState[0];
  const vids=(UNIT0.videos||[]).map(v=>`<div class="video-title">▶️ ${v.title}</div><a class="video-thumb" href="https://www.youtube.com/watch?v=${v.youtube}" target="_blank" rel="noopener"><img src="https://img.youtube.com/vi/${v.youtube}/hqdefault.jpg" alt="${v.title}" onerror="this.style.display='none'"><span class="play-badge"></span><span class="yt-tag">Watch on YouTube ↗</span></a>`).join("")+`<div class="video-note">Tap a video to watch it on YouTube, then come back to finish the unit.</div>`;
  const secs=(UNIT0.sections||[]).map(s=>{
    let inner=`<h3>${s.h}</h3>`;
    if(s.p)inner+=`<p>${s.p}</p>`;
    if(s.links)inner+=`<div class="link-row">${s.links.map(l=>`<a class="safety-link" href="${l.url}" target="_blank" rel="noopener">🔗 ${l.label}</a>`).join("")}</div>`;
    if(s.list){const cls=s.h.indexOf("NEVER")>-1?"dont":s.h.indexOf("ALWAYS")>-1?"do":"plain";inner+=`<ul class="u0-list ${cls}">${s.list.map(i=>`<li>${i}</li>`).join("")}</ul>`;}
    if(s.crews)inner+=`<div class="crew-grid">${s.crews.map(c=>`<div class="crew-card"><h4>${c.n}</h4><div class="cl">Beginning</div><p>${c.start}</p><div class="ce">End</div><p>${c.end}</p></div>`).join("")}</div>`;
    if(s.two)inner+=`<div class="u0-two">${Object.entries(s.two).map(([k,v],i)=>`<div class="tcol ${i===0?"start":"end"}"><h4>${k}</h4><ul class="u0-list plain">${v.map(x=>`<li>${x}</li>`).join("")}</ul></div>`).join("")}</div>`;
    return `<div class="u0-section">${inner}</div>`;
  }).join("");

  panel.innerHTML=`<div class="panel">
    <div class="detail-wk">Start Here — Required Before Clay</div>
    <div class="detail-title">${UNIT0.icon} ${UNIT0.title.replace("Unit 0 — ","")}</div>
    <div class="tabs">
      <button class="tab${tab==="lesson"?" on":""}" onclick="setTab0('lesson')">Lesson & Videos</button>
      <button class="tab${tab==="vocab"?" on":""}" onclick="setTab0('vocab')">Vocabulary</button>
      <button class="tab${tab==="quiz"?" on":""}" onclick="setTab0('quiz')">Safety Quiz</button>
    </div>
    <div class="tc${tab==="lesson"?" on":""}">
      <div class="u0-intro">${UNIT0.intro}</div>
      <div class="bigq-box">💭 ${UNIT0.bigq}</div>
      ${vids}
      ${secs}
    </div>
    <div class="tc${tab==="vocab"?" on":""}">
      <div class="sec-title">Key Terms</div>
      <div class="vocab-list">${UNIT0.vocab.map(v=>`<div class="vocab-item"><span class="vocab-term">${v.term}</span> — ${v.def}</div>`).join("")}</div>
    </div>
    <div class="tc${tab==="quiz"?" on":""}" id="quiz-tab-0"></div>
  </div>`;
  renderQuizTab0();
  panel.scrollIntoView({behavior:"smooth",block:"nearest"});
}
function setTab0(t){tabState[0]=t;renderUnit0();}

function quiz0Passed(){const qs=quizState[0]||{};if(!qs.done)return false;const W=UNIT0.quizzes;const correct=W.reduce((s,q,i)=>s+(qs.currentAnswers[i]===q.ans?1:0),0);return Math.round(correct/W.length*100)>=PASS_PCT;}
function renderQuizTab0(){
  const W=UNIT0.quizzes;
  const qs=quizState[0]||{attempts:0,currentAnswers:{},done:false};quizState[0]=qs;
  ensureOrder(qs,W);
  const passed=quiz0Passed();
  const answered=Object.keys(qs.currentAnswers).length;
  const container=document.getElementById("quiz-tab-0");if(!container)return;
  container.innerHTML=`
    <div class="quiz-header">
      <div class="quiz-header-title">🛡️ Safety Quiz — ${W.length} questions <span class="pass-pill">Pass = ${PASS_PCT}%</span></div>
      <div style="display:flex;align-items:center;gap:6px"><button class="retake-btn" id="retake-btn-0" ${passed?"disabled":""} onclick="retakeQuiz0()">↺ Retake</button><span class="retake-label" id="retake-lbl-0">${passed?"(passed ✓)":"(unlimited retakes)"}</span></div>
    </div>
    <div class="attempt-line">Attempt ${(qs.attempts||0)+1}${passed?" · Passed ✓":""}</div>
    <div class="quiz-progress">
      <div class="quiz-prog-bar"><div class="quiz-prog-fill" id="qprog-fill-0" style="width:${Math.round(answered/W.length*100)}%"></div></div>
      <div class="quiz-prog-label" id="qprog-lbl-0">${answered} / ${W.length} answered</div>
    </div>
    ${qs.order.map((origI,displayPos)=>{const q=W[origI];const chosen=qs.currentAnswers[origI];const isDone=chosen!=null;
      return `<div class="quiz-card"><div class="quiz-qnum">Question ${displayPos+1} of ${W.length}</div><div class="quiz-q">${q.q}</div>
      ${qs.optOrder[origI].map(origJ=>{const o=q.opts[origJ];let cls="";if(isDone){if(origJ===q.ans)cls=" right";else if(origJ===chosen)cls=" wrong";}return `<button class="qo qopt0-${origI}${cls}" data-orig="${origJ}" ${isDone?"disabled":""} onclick="answerQuiz0(${origI},${origJ})">${o}</button>`;}).join("")}</div>`;
    }).join("")}
    <div class="quiz-result" id="quiz-result-0" style="${qs.done?"":"display:none"}"></div>`;
  if(qs.done)showQuizResult0();
}
function answerQuiz0(qIdx,chosenOrig){
  const qs=quizState[0];if(!qs||qs.done)return;
  qs.currentAnswers[qIdx]=chosenOrig;const W=UNIT0.quizzes;
  document.querySelectorAll(`.qopt0-${qIdx}`).forEach(o=>{const oj=parseInt(o.dataset.orig,10);o.disabled=true;if(oj===W[qIdx].ans)o.classList.add("right");else if(oj===chosenOrig)o.classList.add("wrong");});
  const answered=Object.keys(qs.currentAnswers).length;
  const pf=document.getElementById("qprog-fill-0");const pl=document.getElementById("qprog-lbl-0");
  if(pf)pf.style.width=Math.round(answered/W.length*100)+"%";
  if(pl)pl.textContent=answered+" / "+W.length+" answered";
  if(W.every((_,i)=>qs.currentAnswers[i]!=null)){
    qs.done=true;
    const correct=W.reduce((s,q,i)=>s+(qs.currentAnswers[i]===q.ans?1:0),0);
    qs.bestScore=Math.max(qs.bestScore||0,correct);
    lsSave(student,0,"quizstate",qs);cloudSave(student,0,"quizstate",qs);showSaving("Safety quiz saved…");
    showQuizResult0();renderGrid();
  }
}
function showQuizResult0(){
  const W=UNIT0.quizzes;const qs=quizState[0];
  const correct=W.reduce((s,q,i)=>s+(qs.currentAnswers[i]===q.ans?1:0),0);
  const pct=Math.round(correct/W.length*100);
  const passed=pct>=PASS_PCT;
  const cls=passed?"pass":"fail";
  const msg=passed?"You're ready for the studio! 🎉 (80%+)":`You need ${PASS_PCT}% to pass. You got ${pct}% — tap Retake to try again.`;
  const el=document.getElementById("quiz-result-0");
  if(el){el.style.display="block";el.className="quiz-result "+cls;el.innerHTML=`<div class="result-score">${correct} / ${W.length}</div><div class="result-label">${pct}% correct · Attempt ${(qs.attempts||0)+1}</div><div class="result-msg ${cls}">${msg}</div>`;}
  const rb=document.getElementById("retake-btn-0");const rl=document.getElementById("retake-lbl-0");
  if(rb&&rl){rb.disabled=passed;rl.textContent=passed?"(passed ✓)":"(unlimited retakes)";}
}
function retakeQuiz0(){
  const qs=quizState[0]||{};if(quiz0Passed())return;
  qs.attempts=(qs.attempts||0)+1;qs.currentAnswers={};qs.done=false;
  const o=makeQuizOrder(UNIT0.quizzes);qs.order=o.order;qs.optOrder=o.optOrder;quizState[0]=qs;
  lsSave(student,0,"quizstate",qs);cloudSave(student,0,"quizstate",qs);renderQuizTab0();
}

function exitPreview(){previewMode=false;student=null;activeWk=null;if(typeof stopLockRefresh==="function")stopLockRefresh();render();}
render();
</script>
