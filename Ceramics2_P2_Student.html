<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ceramics 2 — Period 2</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#FBF6F1;color:#2C2C2A;min-height:100vh}
.app{max-width:900px;margin:0 auto;padding:1.5rem 1rem}
h1{font-size:22px;font-weight:700;color:#5A2E18;margin-bottom:4px}
.sub{font-size:14px;color:#5F5E5A;margin-bottom:1.5rem}
.login-card{background:#fff;border:1px solid #D3D1C7;border-radius:12px;padding:2rem;max-width:440px;margin:2rem auto;box-shadow:0 2px 12px rgba(158,79,40,0.10)}
.login-card h2{font-size:18px;font-weight:700;color:#5A2E18;margin-bottom:6px}
.login-card p{font-size:13px;color:#5F5E5A;margin-bottom:1.25rem;line-height:1.6}
select,textarea,button{font-family:Arial,sans-serif}
select{width:100%;padding:10px 12px;border:1px solid #B4B2A9;border-radius:8px;background:#fff;color:#2C2C2A;font-size:14px;margin-bottom:1rem}
.btn{width:100%;padding:11px;border-radius:8px;border:none;background:#C2683E;color:white;font-size:14px;cursor:pointer;font-weight:700}
.btn:hover{background:#9E4F28}
.btn:disabled{background:#D3D1C7;color:#888780;cursor:not-allowed}
.btn-sm{padding:6px 14px;border-radius:8px;border:1px solid #B4B2A9;background:transparent;font-size:13px;cursor:pointer;color:#2C2C2A;font-weight:700}
.btn-sm:hover{background:#F6E9DF;color:#8A4424}
.progress-bar{background:#D3D1C7;border-radius:99px;height:7px;margin-top:12px;overflow:hidden}
.progress-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#C2683E,#9E4F28);transition:width 0.5s ease}
.progress-label{font-size:12px;color:#5F5E5A;margin-top:5px}
.week-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:1.5rem}
.week-card{background:#fff;border:1px solid #D3D1C7;border-radius:12px;padding:14px;cursor:pointer;transition:all 0.18s;position:relative}
.week-card:hover{border-color:#C2683E;transform:translateY(-2px);box-shadow:0 4px 14px rgba(194,104,62,0.18)}
.week-card.active{border:2px solid #C2683E}
.week-card.done .wk-icon{background:#EAF3DE}
.week-card.new-badge::after{content:"NEW";position:absolute;top:8px;right:8px;background:#C2683E;color:#fff;font-size:9px;font-weight:700;padding:2px 6px;border-radius:99px}
.week-card.locked-week{opacity:0.55;cursor:not-allowed}
.week-card.locked-week:hover{transform:none;box-shadow:none;border-color:#D3D1C7}
.lock-notice{display:flex;align-items:center;gap:10px;padding:12px 14px;background:#FCEBEB;border:1px solid #E24B4A;border-radius:8px;font-size:13px;color:#791F1F;font-weight:700;margin-bottom:1rem}
.wk-num{font-size:11px;color:#5F5E5A;font-weight:700;text-transform:uppercase;letter-spacing:0.05em}
.wk-icon{width:36px;height:36px;border-radius:8px;background:#F6E9DF;display:flex;align-items:center;justify-content:center;margin:8px 0 6px;font-size:18px}
.wk-title{font-size:12px;font-weight:700;color:#2C2C2A;line-height:1.35}
.panel{background:#fff;border:1px solid #D3D1C7;border-radius:12px;padding:1.5rem;margin-top:1rem}
.detail-wk{font-size:12px;color:#5F5E5A;font-weight:700;text-transform:uppercase;letter-spacing:0.05em}
.detail-title{font-size:19px;font-weight:700;color:#2C2C2A;margin-top:2px;margin-bottom:1rem}
.overview{font-size:14px;color:#5F5E5A;line-height:1.65;margin-bottom:1.25rem;padding:12px;background:#FBF6F1;border-radius:8px;border-left:3px solid #C2683E}
.checklist{background:#FFF8EC;border:1px solid #F0C97A;border-radius:8px;padding:12px 14px;margin-bottom:1.25rem}
.checklist-title{font-size:12px;font-weight:700;color:#633806;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:8px}
.checklist ul{list-style:none;padding:0}
.checklist li{font-size:13px;color:#2C2C2A;padding:3px 0;display:flex;align-items:flex-start;gap:8px;line-height:1.5}
.checklist li::before{content:"☐";color:#BA7517;font-size:14px;flex-shrink:0}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1.25rem}
.sec-title{font-size:12px;font-weight:700;color:#5F5E5A;margin-bottom:8px;text-transform:uppercase;letter-spacing:0.04em}
.pill-list{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:12px;padding:4px 10px;border-radius:99px;background:#F6E9DF;color:#8A4424;border:1px solid #E0B79A;line-height:1.4}
.vocab-list{display:flex;flex-direction:column;gap:5px}
.vocab-item{font-size:13px;color:#2C2C2A;line-height:1.5}
.vocab-term{font-weight:700;color:#8A4424}
.tabs{display:flex;border-bottom:2px solid #F6E9DF;margin-bottom:1.25rem;flex-wrap:wrap}
.tab{font-size:13px;padding:9px 16px;border:none;background:transparent;cursor:pointer;color:#5F5E5A;border-bottom:3px solid transparent;margin-bottom:-2px;font-weight:700}
.tab.on{color:#9E4F28;border-bottom-color:#9E4F28}
.tab:hover{color:#5A2E18}
.tc{display:none}.tc.on{display:block}
.rtable{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}
.rtable th{padding:9px 10px;text-align:left;background:#F1EFE8;color:#5F5E5A;font-weight:700;border:1px solid #D3D1C7;font-size:12px}
.rtable td{padding:10px;vertical-align:top;border:1px solid #D3D1C7;color:#2C2C2A;line-height:1.5;font-size:13px}
.rtable thead tr th:nth-child(2){background:#EAF3DE;color:#27500A}
.rtable thead tr th:nth-child(3){background:#FAEEDA;color:#633806}
.rtable thead tr th:nth-child(4){background:#FCEBEB;color:#791F1F}
.sc{text-align:center}
.sb{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;border:1px solid #B4B2A9;background:transparent;cursor:pointer;font-size:12px;font-weight:700;color:#5F5E5A;margin:2px;transition:all 0.15s}
.sb.s4{background:#EAF3DE;color:#27500A;border-color:#639922}
.sb.s2{background:#FAEEDA;color:#633806;border-color:#BA7517}
.sb.s0{background:#FCEBEB;color:#791F1F;border-color:#E24B4A}
.total-bar{margin-top:1rem;display:flex;align-items:center;gap:12px;padding:12px;background:#FBF6F1;border-radius:8px}
.total-num{font-size:22px;font-weight:700;color:#2C2C2A}
.total-lbl{font-size:13px;color:#5F5E5A}
.rq{font-size:13px;font-weight:700;color:#2C2C2A;margin:14px 0 5px}
textarea{width:100%;font-size:13px;border:1px solid #D3D1C7;border-radius:8px;padding:8px 10px;background:#fff;color:#2C2C2A;resize:vertical;min-height:62px;line-height:1.5}
.act-row{margin-top:1.25rem;display:flex;gap:8px}
.act-row button{flex:1;padding:10px;border-radius:8px;border:1px solid #B4B2A9;background:transparent;font-size:14px;cursor:pointer;color:#2C2C2A;font-weight:700}
.act-row button:hover{background:#FBF6F1}
.act-row button.primary{background:#C2683E;color:#fff;border-color:#C2683E}
.act-row button.primary:hover{background:#9E4F28}
.submit-banner{background:#EAF3DE;color:#27500A;border:1px solid #97C459;border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:1rem;font-weight:700}
.sbar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#F6E9DF;border-radius:8px;margin-bottom:1.2rem}
.sname{font-weight:700;color:#5A2E18;font-size:14px}
.saving{font-size:12px;color:#C2683E;margin-left:auto;min-width:80px;text-align:right}
/* quiz */
.quiz-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;flex-wrap:wrap;gap:8px}
.quiz-header-title{font-size:15px;font-weight:700;color:#5A2E18}
.retake-btn{padding:6px 14px;border-radius:8px;border:1px solid #C2683E;background:transparent;color:#C2683E;font-size:12px;font-weight:700;cursor:pointer;transition:all 0.15s}
.retake-btn:hover{background:#F6E9DF}
.retake-btn:disabled{border-color:#D3D1C7;color:#B4B2A9;cursor:not-allowed}
.retake-label{font-size:11px;color:#888780;margin-left:4px}
.quiz-progress{display:flex;align-items:center;gap:8px;margin-bottom:1.25rem}
.quiz-prog-bar{flex:1;height:6px;background:#F6E9DF;border-radius:99px;overflow:hidden}
.quiz-prog-fill{height:100%;border-radius:99px;background:#C2683E;transition:width 0.3s}
.quiz-prog-label{font-size:12px;color:#5F5E5A;white-space:nowrap;font-weight:700}
.quiz-card{background:#FBF6F1;border-radius:10px;padding:1.25rem;margin-bottom:1rem}
.quiz-qnum{font-size:11px;font-weight:700;color:#C2683E;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px}
.quiz-q{font-size:15px;font-weight:700;color:#2C2C2A;margin-bottom:14px;line-height:1.5}
.qo{font-size:13px;padding:10px 14px;border-radius:8px;border:1px solid #D3D1C7;cursor:pointer;background:#fff;color:#2C2C2A;text-align:left;width:100%;margin-bottom:6px;display:block;transition:all 0.15s;line-height:1.4}
.qo:hover:not(:disabled){background:#F6E9DF;border-color:#E0B79A}
.qo.right{background:#EAF3DE;border-color:#639922;color:#27500A;font-weight:700}
.qo.wrong{background:#FCEBEB;border-color:#E24B4A;color:#791F1F}
.quiz-result{margin-top:1.25rem;padding:1.25rem;border-radius:10px;text-align:center}
.quiz-result.pass{background:#EAF3DE;border:1px solid #97C459}
.quiz-result.fail{background:#FCEBEB;border:1px solid #E24B4A}
.quiz-result.ok{background:#FAEEDA;border:1px solid #BA7517}
.result-score{font-size:32px;font-weight:700;color:#2C2C2A;margin-bottom:4px}
.result-label{font-size:14px;color:#5F5E5A;margin-bottom:8px}
.result-msg{font-size:13px;font-weight:700}
.result-msg.pass{color:#27500A}
.result-msg.ok{color:#633806}
.result-msg.fail{color:#791F1F}


.ex-lightbox-wrap{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:9999;align-items:center;justify-content:center;flex-direction:column;gap:12px}
.ex-lightbox-wrap.on{display:flex}
.ex-lightbox-wrap img{max-width:92vw;max-height:82vh;border-radius:10px;object-fit:contain}
.ex-lb-close{position:absolute;top:16px;right:20px;color:#fff;font-size:28px;cursor:pointer;background:none;border:none;font-weight:700}
.ex-lb-label{color:#fff;font-size:14px;text-align:center;max-width:80vw;padding:0 1rem}

/* examples gallery */
.examples-section{margin-top:1.5rem;padding-top:1.5rem;border-top:1px solid #F6E9DF}
.examples-title{font-size:13px;font-weight:700;color:#5A2E18;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.examples-sub{font-size:12px;color:#5F5E5A;margin-bottom:12px}
.examples-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.ex-card{border-radius:10px;overflow:hidden;border:1px solid #D3D1C7;cursor:pointer;transition:transform 0.15s,box-shadow 0.15s;background:#F1EFE8}
.ex-card:hover{transform:translateY(-3px);box-shadow:0 6px 18px rgba(83,74,183,0.15)}
.ex-card img{width:100%;height:150px;object-fit:cover;display:block}
.ex-caption{font-size:11px;color:#5F5E5A;padding:6px 8px;background:#fff;border-top:1px solid #F6E9DF;line-height:1.4}


/* illustration worksheet */
.careers-table{width:100%;border-collapse:collapse;font-size:13px;margin:1rem 0}
.careers-table th{padding:9px 10px;text-align:left;background:#C2683E;color:#fff;font-weight:700;font-size:12px;border:1px solid #E0B79A}
.careers-table td{padding:9px 10px;border:1px solid #D3D1C7;vertical-align:top;line-height:1.5;font-size:13px;color:#2C2C2A}
.careers-table tr:nth-child(even) td{background:#FBF6F1}
.careers-table tr:hover td{background:#F6E9DF}
.worksheet-section{margin-bottom:1.5rem}
.worksheet-section h3{font-size:14px;font-weight:700;color:#5A2E18;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.worksheet-q{font-size:13px;font-weight:700;color:#2C2C2A;margin:12px 0 5px}
.worksheet-input{width:100%;font-size:13px;border:1px solid #D3D1C7;border-radius:8px;padding:8px 10px;background:#fff;color:#2C2C2A;resize:vertical;min-height:62px;line-height:1.5;font-family:Arial,sans-serif}
.worksheet-field{width:100%;font-size:13px;border:0;border-bottom:1.5px solid #B4B2A9;padding:6px 4px;background:transparent;color:#2C2C2A;font-family:Arial,sans-serif;margin-bottom:8px;outline:none}
.worksheet-field:focus{border-bottom-color:#C2683E}
.salary-badge{display:inline-block;font-size:11px;background:#EAF3DE;color:#27500A;border-radius:99px;padding:2px 8px;font-weight:700;white-space:nowrap}
.ext-box{background:#FFF8EC;border:1px solid #F0C97A;border-radius:8px;padding:1rem 1.25rem;margin-top:1rem}
.ext-box h3{color:#633806}
.submit-ws-btn{margin-top:1.25rem;width:100%;padding:11px;border-radius:8px;border:none;background:#C2683E;color:white;font-size:14px;cursor:pointer;font-weight:700;font-family:Arial,sans-serif}
.submit-ws-btn:hover{background:#9E4F28}
.submit-ws-btn:disabled{background:#D3D1C7;color:#888780;cursor:not-allowed}
.ws-saved-banner{background:#EAF3DE;color:#27500A;border:1px solid #97C459;border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:1rem;font-weight:700}


/* week 3 typography worksheet */
.font-example-box{background:#FBF6F1;border-left:4px solid #C2683E;border-radius:8px;padding:1rem 1.25rem;margin-bottom:1.5rem}
.font-example-box h4{font-size:13px;font-weight:700;color:#5A2E18;margin-bottom:8px;text-transform:uppercase;letter-spacing:0.04em}
.font-example-label{font-size:12px;font-weight:700;color:#5F5E5A;margin:8px 0 2px;text-transform:uppercase;letter-spacing:0.03em}
.font-example-val{font-size:13px;color:#2C2C2A;line-height:1.6;padding:4px 0}
.font-example-georgia{font-family:Georgia,serif;font-size:18px;color:#5A2E18;padding:8px 0}
.ws3-field{width:100%;font-size:13px;border:0;border-bottom:1.5px solid #B4B2A9;padding:6px 4px;background:transparent;color:#2C2C2A;font-family:Arial,sans-serif;margin-bottom:10px;outline:none}
.ws3-field:focus{border-bottom-color:#C2683E}
.ws3-textarea{width:100%;font-size:13px;border:1px solid #D3D1C7;border-radius:8px;padding:8px 10px;background:#fff;color:#2C2C2A;resize:vertical;min-height:60px;line-height:1.5;font-family:Arial,sans-serif}
.ws3-section{margin-bottom:1.5rem}
.ws3-section h3{font-size:14px;font-weight:700;color:#5A2E18;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.ws3-q{font-size:13px;font-weight:700;color:#2C2C2A;margin:12px 0 5px}
.font-preview-box{border:1px solid #D3D1C7;border-radius:8px;padding:1rem;background:#fff;text-align:center;margin:10px 0}
.font-preview-text{font-size:28px;color:#5A2E18;margin-bottom:4px;line-height:1.3}
.font-preview-label{font-size:11px;color:#5F5E5A;font-weight:700;text-transform:uppercase;letter-spacing:0.05em}


.download-btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:8px;border:1.5px solid #C2683E;background:#F6E9DF;color:#8A4424;font-size:13px;font-weight:700;cursor:pointer;text-decoration:none;transition:all 0.15s;font-family:Arial,sans-serif;margin-bottom:1rem}
.download-btn:hover{background:#C2683E;color:#fff}

/* upload */
.upload-section{margin-top:1.5rem;border-top:1px solid #F6E9DF;padding-top:1.5rem}
.upload-zone{border:2px dashed #E0B79A;border-radius:10px;padding:2rem;text-align:center;cursor:pointer;transition:all 0.2s;background:#FAFAFA;position:relative}
.upload-zone:hover{border-color:#C2683E;background:#FBF6F1}
.upload-zone.drag-over{border-color:#9E4F28;background:#F6E9DF}
.upload-icon{font-size:32px;margin-bottom:8px}
.upload-text{font-size:14px;font-weight:700;color:#5A2E18;margin-bottom:4px}
.upload-sub{font-size:12px;color:#5F5E5A}
.upload-input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.preview-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:1rem}
.preview-item{position:relative;border-radius:8px;overflow:hidden;border:1px solid #D3D1C7;background:#F1EFE8}
.preview-item img{width:100%;height:120px;object-fit:cover;display:block}
.preview-label{font-size:11px;color:#5F5E5A;padding:4px 6px;background:#fff;border-top:1px solid #D3D1C7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.preview-remove{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,0.6);color:#fff;border:none;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;line-height:1}
.upload-count{font-size:12px;color:#C2683E;font-weight:700;margin-top:8px}
@media(max-width:600px){.two-col{grid-template-columns:1fr}.rtable{font-size:11px}}

/* Ceramic History callout */
.history-box{background:#FBF1E6;border:1px solid #E0B79A;border-radius:10px;padding:1.25rem;margin-bottom:1rem}
.history-box h4{font-size:13px;font-weight:700;color:#8A4424;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.history-box p{font-size:14px;color:#4A3326;line-height:1.7;margin-bottom:0}
.fact-box{background:#5A2E18;border-radius:10px;padding:1.25rem;margin-top:1rem}
.fact-box .fact-tag{font-size:11px;font-weight:700;color:#E0B79A;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px}
.fact-box .fact-text{font-size:14px;color:#FBF1E6;line-height:1.7}
.fact-box .fact-src{font-size:11px;color:#C2683E;margin-top:8px;font-style:italic}

/* Unit 0 — Safety */
.u0-card{border:2px solid #BA7517 !important;background:#FFF8EC !important}
.u0-card .wk-icon{background:#FAEEDA}
.video-wrap{position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:10px;margin:10px 0;background:#000}
.video-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0}
.video-title{font-size:13px;font-weight:700;color:#5A2E18;margin:14px 0 2px;display:flex;align-items:center;gap:6px}
.video-thumb{display:block;position:relative;border-radius:10px;overflow:hidden;margin:10px 0;text-decoration:none;border:1px solid #D3D1C7;background:#000}
.video-thumb img{width:100%;display:block;opacity:0.92;transition:opacity .15s}
.video-thumb:hover img{opacity:1}
.video-thumb .play-badge{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:68px;height:48px;background:rgba(0,0,0,0.75);border-radius:12px;display:flex;align-items:center;justify-content:center;transition:background .15s}
.video-thumb:hover .play-badge{background:#C2683E}
.video-thumb .play-badge::before{content:"";border-style:solid;border-width:11px 0 11px 19px;border-color:transparent transparent transparent #fff;margin-left:4px}
.video-thumb .yt-tag{position:absolute;bottom:8px;right:10px;background:rgba(0,0,0,0.78);color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:5px}
.video-note{font-size:12px;color:#5F5E5A;margin:2px 0 10px;font-style:italic}

.u0-section{margin-bottom:1.4rem;padding-bottom:1.2rem;border-bottom:1px solid #F0E2CC}
.u0-section:last-child{border-bottom:none}
.u0-section h3{font-size:15px;font-weight:700;color:#5A2E18;margin-bottom:8px}
.u0-section p{font-size:14px;color:#4A3326;line-height:1.7;margin-bottom:8px}
.u0-list{list-style:none;padding:0;margin:6px 0}
.u0-list li{font-size:13.5px;color:#2C2C2A;padding:5px 0 5px 24px;position:relative;line-height:1.55}
.u0-list.dont li::before{content:"\2716";position:absolute;left:0;color:#E24B4A;font-weight:700}
.u0-list.do li::before{content:"\2714";position:absolute;left:0;color:#27500A;font-weight:700}
.u0-list.plain li::before{content:"\2022";position:absolute;left:2px;color:#BA7517;font-weight:700}
.bigq-box{background:#5A2E18;color:#FBF1E6;border-radius:10px;padding:1.1rem 1.3rem;font-size:15px;font-weight:700;line-height:1.5;margin:1rem 0;text-align:center}
.link-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.safety-link{font-size:12px;padding:5px 11px;border-radius:99px;background:#F6E9DF;color:#8A4424;border:1px solid #E0B79A;text-decoration:none;font-weight:700}
.safety-link:hover{background:#C2683E;color:#fff}
.crew-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.crew-card{border:1px solid #E0B79A;border-radius:10px;background:#fff;padding:10px 12px}
.crew-card h4{font-size:13px;font-weight:700;color:#8A4424;margin-bottom:6px}
.crew-card .cl{font-size:11px;font-weight:700;color:#27500A;text-transform:uppercase;letter-spacing:.03em;margin-top:6px}
.crew-card .ce{font-size:11px;font-weight:700;color:#791F1F;text-transform:uppercase;letter-spacing:.03em;margin-top:6px}
.crew-card p{font-size:12.5px;color:#4A3326;line-height:1.5;margin:2px 0 0}
.u0-two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.u0-two .tcol{border:1px solid #D3D1C7;border-radius:10px;background:#fff;padding:10px 12px}
.u0-two .tcol h4{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px}
.u0-two .tcol.start h4{color:#27500A}
.u0-two .tcol.end h4{color:#791F1F}
.u0-intro{font-size:14px;color:#4A3326;line-height:1.7;margin-bottom:4px}
@media(max-width:600px){.crew-grid,.u0-two{grid-template-columns:1fr}}

.pass-pill{display:inline-block;font-size:10px;font-weight:700;background:#27500A;color:#fff;padding:2px 8px;border-radius:99px;margin-left:6px;vertical-align:middle}
.attempt-line{font-size:12px;font-weight:700;color:#8A4424;margin:0 0 8px}
.quiz-result.fail{border-color:#E6B7B7}

.pin-wrap{text-align:center}

.pin-sub{font-size:12.5px;color:#7A6A5C;margin-bottom:14px}
.pin-dots{display:flex;justify-content:center;gap:12px;margin:14px 0 18px}
.pin-dot{width:14px;height:14px;border-radius:50%;border:2px solid #C2683E;background:transparent;transition:background .1s}

.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:240px;margin:0 auto}
.pin-key{padding:14px 0;font-size:20px;font-weight:700;border:1px solid #E0B79A;background:#fff;color:#5A2E18;border-radius:10px;cursor:pointer;transition:background .1s}
.pin-key:hover{background:#F6E9DF}
.pin-key.wide{grid-column:span 1}
.pin-err{color:#C0392B;font-size:13px;font-weight:700;margin-top:12px;min-height:18px}
.pin-back{margin-top:14px;background:none;border:none;color:#8A4424;font-size:12px;font-weight:700;cursor:pointer;text-decoration:underline}

.teacher-preview-link{display:block;margin:14px auto 0;background:none;border:none;color:#888;font-size:12px;font-weight:700;cursor:pointer;text-decoration:underline}

.preview-banner{background:#3A2D5F;color:#fff;font-size:12.5px;font-weight:700;text-align:center;padding:7px 12px;border-radius:8px;margin:0 0 12px;display:flex;align-items:center;justify-content:center;gap:10px}
.preview-banner button{background:rgba(255,255,255,0.2);border:none;color:#fff;font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;cursor:pointer}

.glaze-do{background:#EAF6EE;border:1px solid #A9D5B9;border-left:5px solid #3E9B5F;border-radius:8px;padding:11px 15px;margin-bottom:12px}

<script>
const STUDENTS=["Aburahma, Mira", "Balko, Evan", "Barati, Zahra", "Clarke, Chloe", "Hatmaker, Brianna", "Hill, Natrielle", "Ingram, Londyn", "Jacobs, Naijah", "Johnson-Reedus, Ja'Mayah", "Lopez, Jacqueline", "Maxwell, Giovanni", "Miranda, Carolina", "Morgan, Audree", "Mullins, Ava", "Nevins, Mya", "Ramos, Isabella", "Thomas Clifford, Kori", "Thomas, Ma'Kayla", "Toth, Sophie", "Walker, Emma", "White, Nyla"];
const PINS={"Aburahma, Mira": "1275", "Balko, Evan": "6274", "Barati, Zahra": "1226", "Clarke, Chloe": "6552", "Hatmaker, Brianna": "3811", "Hill, Natrielle": "8219", "Ingram, Londyn": "4999", "Jacobs, Naijah": "8635", "Johnson-Reedus, Ja'Mayah": "9869", "Lopez, Jacqueline": "6792", "Maxwell, Giovanni": "5087", "Miranda, Carolina": "3643", "Morgan, Audree": "5687", "Mullins, Ava": "7971", "Nevins, Mya": "8230", "Ramos, Isabella": "2584", "Thomas Clifford, Kori": "3639", "Thomas, Ma'Kayla": "9914", "Toth, Sophie": "5397", "Walker, Emma": "6391", "White, Nyla": "8335"};
const weeks=[{"num": 1, "icon": "🎨", "title": "Unit 1 — Clay Stages Poster", "overview": "Your first project is a creative challenge — and a sneaky way to lock in the vocabulary you'll use all semester. Design a UNIQUE, eye-catching poster that visualizes the six stages clay passes through, from wet goop to finished glazed ceramic. This is an ART project, not a worksheet: you choose the theme, the style, and how to show each stage. Make it a comic strip, a journey map, a character's life story, a recipe, a video-game level select, a meme series — whatever makes the science of clay actually fun to look at. The only rule: all six stages must be clearly shown, labeled, and in the right order. Think of it as the warm-up that makes you the clay expert before your hands ever touch the wheel.", "skills": ["Identifying and correctly ordering the 6 stages of clay", "Visually representing an abstract process in a creative way", "Using a clear theme or concept to tie the poster together", "Labeling each stage with its correct name", "Applying design basics: title, layout, color, readability", "Showing personality and originality — no two posters alike"], "vocab": [{"term": "Slip", "def": "Clay mixed with water to a liquid, runny consistency; used as 'glue' to join pieces."}, {"term": "Plastic (Workable)", "def": "Soft, moist, fully workable clay — the stage where you build and shape."}, {"term": "Leather-hard", "def": "Partially dried clay — firm like leather, ideal for carving, joining, and trimming."}, {"term": "Bone-dry (Greenware)", "def": "Completely air-dried, unfired clay. Very fragile and ready for the first firing."}, {"term": "Bisqueware", "def": "Clay after its first firing — hard, porous, and no longer able to be reclaimed."}, {"term": "Glazeware", "def": "Bisqueware that has been glazed and fired again — the finished, sealed ceramic."}], "quizzes": [{"q": "What is the correct order of the clay stages?", "opts": ["Bone-dry → slip → plastic → bisque → glaze → leather-hard", "Slip → plastic → leather-hard → bone-dry → bisqueware → glazeware", "Plastic → bisque → slip → glaze → bone-dry → leather-hard", "Glazeware → bisqueware → bone-dry → leather-hard → plastic → slip"], "ans": 1}, {"q": "Which stage is liquid clay used as 'glue'?", "opts": ["Slip", "Leather-hard", "Bisqueware", "Glazeware"], "ans": 0}, {"q": "At which stage is clay soft and fully workable for building?", "opts": ["Bone-dry", "Plastic (workable)", "Bisqueware", "Glazeware"], "ans": 1}, {"q": "What is leather-hard clay best for?", "opts": ["Drinking from", "Carving, joining, and trimming", "Reclaiming into slip", "Eating off of"], "ans": 1}, {"q": "What is bone-dry, unfired clay also called?", "opts": ["Slipware", "Greenware", "Bisqueware", "Glazeware"], "ans": 1}, {"q": "What happens to clay after its FIRST firing?", "opts": ["It becomes slip", "It becomes bisqueware — hard and porous", "It melts", "It can still be reclaimed"], "ans": 1}, {"q": "Once clay is bisque-fired, can it be turned back into workable clay?", "opts": ["Yes, just add water", "No — firing is permanent", "Only if it's leather-hard", "Only with glaze"], "ans": 1}, {"q": "What makes a piece 'glazeware'?", "opts": ["It's been glazed and fired a second time", "It's still wet", "It's been carved", "It's air-dried only"], "ans": 0}], "rubric": [{"cat": "All 6 Stages Shown & Ordered", "ex4": "All six stages are clearly shown, correctly labeled, and in the right order.", "ex2": "Some stages are missing, mislabeled, or out of order.", "ex0": "No attempt."}, {"cat": "Creativity & Theme", "ex4": "A strong, original theme or concept ties the whole poster together memorably.", "ex2": "Some creative effort, but the poster feels generic or like a plain list.", "ex0": "No attempt."}, {"cat": "Design & Craftsmanship", "ex4": "Clear title, strong layout, readable text, and intentional use of color.", "ex2": "Cluttered, hard to read, or rushed-looking design.", "ex0": "No attempt."}], "reflections": ["What do you like the most about your poster?", "Did designing this poster help you remember the stages of clay? (Explain)"], "history": {"didyouknow": "The six stages of clay are really about WATER. Wet clay is full of water that lets it move and bend. As water leaves, the clay gets stiffer (leather-hard), then brittle (bone-dry). Firing then drives out the very last chemical water and permanently fuses the clay — which is why a fired pot can never go back to being workable clay. You're basically controlling water the entire time.", "fact": "There's a point of no return in ceramics called the 'ceramic change.' Around 1063°F during the first firing, the clay crystals chemically transform and water is locked out forever. Before that moment, dried clay can be soaked and reused endlessly; one second after, it's pottery for good. Potters have been crossing that exact threshold for over 25,000 years — fired clay figures older than farming itself have been found.", "factsource": "The Life of Clay"}, "claysci": {"intro": "Before you make anything, it helps to know what clay actually IS and where it comes from. Clay is decomposed rock + water + animal/plant matter + time — and the story of how it forms is surprisingly epic.", "sections": [{"h": "🌍 How clay forms in nature", "p": "Clay is decomposed rock, water, and plant/animal matter, combined over a very long time. Here in Michigan, the raw materials were ground up by glaciers. About 13,000 years ago Michigan was buried under a glacier during the Wisconsin Ice Age. As that ice slowly melted, it carved out the Great Lakes and the land we live on. The glaciers' crushing weight pulverized rock, trapped water, and decomposed plant and animal matter — and the layered bands of soil and clay you can still see in the ground today are the result. That's how the clay we use was formed in nature."}, {"h": "🧱 Clay bodies (no, not dead bodies!)", "p": "A 'clay body' is a mixture of different clays blended to behave the way we want. Different source rocks make different clays:", "list": ["Kaolin clay (from granite) — very strong and fires to a white color.", "Montmorillonite (from shale, a soft rock) — a very soft clay that fires gray.", "Terra cotta ('baked earth') — contains iron oxide, which makes it fire red."]}, {"h": "🔥 Hardening clay: firing & kilns", "p": "To make clay permanently hard, it goes through a process called FIRING. It's heated to roughly 1800–2100°F to permanently harden it. The device that heats it is called a KILN. Once clay is fired, the change is permanent — it can never go back to workable clay."}, {"h": "✨ Glaze", "p": "Glaze is a glassy coating applied to pottery and then fired. It does four jobs: it makes the pottery waterproof, makes it easier to clean, keeps germs and bacteria out of the porous fired clay, and decorates the piece."}, {"h": "🆚 Greenware vs. Bisqueware", "p": "Greenware is unfired, bone-dry clay — fragile and still able to be reclaimed. Bisqueware is clay after its first firing — hard, porous, permanent, and ready to be glazed. (You'll show both of these in your Clay Stages Poster!)"}, {"h": "🛠️ What we make from clay", "p": "Once clay is ready, we use tools and techniques to build all kinds of objects — pinch pots, coil pots, cut boxes, ring holders, wall pockets, dessert plates, and much more. This semester you'll try several of these."}], "videos": [{"title": "Prehistoric Pottery (5:18)", "youtube": "nrI1LJbKIvk"}, {"title": "How It's Made: Bricks", "youtube": "SbKvhHzn4hQ"}, {"title": "How It's Made: Production Pottery Vase", "youtube": "jG01fCtj1-U"}, {"title": "How It's Made: Dinnerware", "youtube": "hfv2TPxf-gg"}, {"title": "Unloading a Kiln", "youtube": "jSwKZU0XNJw"}, {"title": "Loading a Kiln", "youtube": "c0ZqiPytWbQ"}]}}, {"num": 2, "icon": "😀", "title": "Unit 2 — Face Mug", "overview": "Personality in a vessel — a mug built around a face. Using your prior knowledge of shaping clay, you'll create a LARGE mug featuring a creative human or animal facial feature and a high-quality, well-attached handle. The handle is 50% of your grade — it must be sturdy, comfortable, and securely joined. Think about your form FIRST, then add features. Not everything has to be glazed: leaving some exterior areas rough adds texture and contrast. This project is all about expression, craftsmanship, and a functional join that survives daily use.", "skills": ["Building a large mug body (3 inch diameter minimum) with even walls", "Designing a human or animal facial feature that suits the form", "Pulling or building a comfortable, sturdy handle — the join is everything", "Scoring & slipping the handle attachment top AND bottom, then blending", "Combining glazed and rough/textured surfaces intentionally", "Considering how far features project so they don't snap off", "Signing your name clearly on the bottom"], "vocab": [{"term": "Pulling a Handle", "def": "Shaping a handle by drawing wet clay downward with a wet hand."}, {"term": "Score & Slip", "def": "Scratch the surface and apply liquid clay to join pieces securely."}, {"term": "Attachment Point", "def": "Where the handle meets the mug — the most common failure spot."}, {"term": "Leather-hard", "def": "Clay that is partially dry — firm but still workable."}, {"term": "Texture", "def": "The surface quality of a piece — rough, smooth, ridged, carved."}, {"term": "Functional Ware", "def": "Ceramics made to be used, like mugs, bowls, and plates."}], "quizzes": [{"q": "What percentage of your grade is the handle?", "opts": ["10%", "25%", "50%", "100%"], "ans": 2}, {"q": "What is the minimum diameter for the mug?", "opts": ["1 inch", "3 inches", "6 inches", "10 inches"], "ans": 1}, {"q": "What MUST you do where the handle meets the mug?", "opts": ["Glaze it first", "Score and slip both ends", "Let it dry separately", "Paint it"], "ans": 1}, {"q": "Why avoid features that stick out too far?", "opts": ["They cost more clay", "They break easily", "They can't be glazed", "They look better flat"], "ans": 1}, {"q": "What does the project say about glazing?", "opts": ["Everything must be glazed", "Nothing should be glazed", "Some rough areas can add texture", "Only the handle is glazed"], "ans": 2}, {"q": "What is 'pulling a handle'?", "opts": ["Removing a broken handle", "Drawing wet clay down with a wet hand to shape it", "Buying a pre-made handle", "Carving a handle from a block"], "ans": 1}], "rubric": [{"cat": "Mug Form & Scale", "ex4": "Mug is large (3 inch+ diameter) with even walls and a strong, well-built body.", "ex2": "Mug is undersized OR walls are uneven, thin, or cracking.", "ex0": "No attempt."}, {"cat": "Handle (50%)", "ex4": "Handle is sturdy, comfortable, and securely scored, slipped & blended at both ends.", "ex2": "Handle is attached but weak, cracking at the join, or awkward to hold.", "ex0": "No attempt."}, {"cat": "Facial Feature & Creativity", "ex4": "A creative human or animal feature is well-integrated into the mug's form.", "ex2": "A feature is present but generic, flat, or poorly connected to the form.", "ex0": "No attempt."}, {"cat": "Surface, Glaze & Name", "ex4": "Color and texture are used intentionally. Name is signed clearly on the bottom.", "ex2": "Glaze/texture is sloppy or rushed OR name is missing from the bottom.", "ex0": "No attempt."}], "reflections": ["What do you like the most about your project?", "What did you find hard or challenging about this project?", "What would you have done differently or changed about your project?"], "history": {"didyouknow": "Face jugs have a long history in American folk pottery, especially among enslaved African American potters in the Edgefield District of South Carolina in the 1800s. These 'face vessels' featured exaggerated, expressive faces and are now considered some of the most important works in American ceramic history.", "fact": "In ancient Peru, the Moche people (100–700 CE) made 'portrait vessels' — mugs and jars sculpted as astonishingly realistic human faces, complete with individual expressions, scars, and emotions. Archaeologists believe some were portraits of actual specific people, making them some of the oldest 'photographs' in human history — in clay.", "factsource": "Faces in Clay"}}, {"num": 3, "icon": "🖋️", "title": "Unit 3 — Sgraffito", "overview": "Drawing by carving away — line, contrast & negative space. Sgraffito (Italian for 'scratched') means coating a piece in colored UNDERGLAZE, then carving THROUGH that layer to reveal the clay beneath. The contrast between the dark underglaze and the lighter clay body creates a bold, graphic image. This project is about LINE QUALITY and CONTRAST: your carved lines ARE your drawing. Plan your design on paper first, apply two to three even coats of underglaze, let it set to leather-hard, then carve with confidence. Mistakes can't be undone — so sketch, then commit.", "skills": ["Applying 2–3 smooth, even coats of underglaze to a leather-hard surface", "Transferring a planned design lightly before carving", "Carving cleanly THROUGH the underglaze to reveal the clay below", "Using line weight and density to build contrast and value", "Balancing carved (light) and uncarved (dark) areas — positive & negative space", "Keeping lines crisp — no chipping, dragging, or muddy edges"], "vocab": [{"term": "Sgraffito", "def": "Carving through colored slip or underglaze to reveal the clay beneath."}, {"term": "Underglaze", "def": "Colored clay-based pigment applied before the clear glaze and firing."}, {"term": "Contrast", "def": "The difference between light and dark, used to make a design stand out."}, {"term": "Line Quality", "def": "The character of a line — thick, thin, smooth, or rough."}, {"term": "Positive Space", "def": "The area occupied by the main subject of the design."}, {"term": "Negative Space", "def": "The empty area around and between the subjects."}], "quizzes": [{"q": "What does 'sgraffito' mean?", "opts": ["Painted", "Scratched", "Smoothed", "Stacked"], "ans": 1}, {"q": "What do you carve THROUGH in sgraffito?", "opts": ["The bare clay", "A layer of underglaze/slip", "The clear glaze", "The kiln shelf"], "ans": 1}, {"q": "How many coats of underglaze should you apply?", "opts": ["None", "Half of one", "2–3 even coats", "Ten thick coats"], "ans": 2}, {"q": "In sgraffito, what creates the image?", "opts": ["The painted color", "The carved lines revealing clay", "The glaze drips", "The kiln heat"], "ans": 1}, {"q": "What is 'negative space'?", "opts": ["A carving mistake", "The empty area around the subject", "A dark glaze", "The bottom of the piece"], "ans": 1}, {"q": "Why must you plan your design before carving?", "opts": ["Carved lines can't be undone", "It dries faster", "Underglaze is expensive", "The kiln requires it"], "ans": 0}], "rubric": [{"cat": "Underglaze Application", "ex4": "Underglaze is applied in smooth, even, opaque coats with no streaks or bare spots.", "ex2": "Underglaze is thin, streaky, or uneven, weakening the contrast.", "ex0": "No attempt."}, {"cat": "Line Quality & Carving", "ex4": "Carved lines are clean, confident, and crisp — no chipping or muddy edges.", "ex2": "Lines are shaky, chipped, or inconsistent in depth.", "ex0": "No attempt."}, {"cat": "Design & Contrast", "ex4": "Design uses positive/negative space and contrast intentionally for a bold image.", "ex2": "Design reads weakly — little contrast or unbalanced carved/uncarved areas.", "ex0": "No attempt."}, {"cat": "Craftsmanship & Name", "ex4": "Surface is clean and professional. Name/chop is clear on the bottom.", "ex2": "Surface is messy or rushed OR signature is missing.", "ex0": "No attempt."}], "reflections": ["What do you like the most about your project?", "What did you find hard or challenging about this project?", "What would you have done differently or changed about your project?"], "history": {"didyouknow": "Sgraffito has been used for over a thousand years — Islamic potters in the 10th century, Italian Renaissance artists on building walls, and Greek vase painters all used scratching-through techniques to create contrast. The word comes from the Italian 'sgraffiare,' meaning 'to scratch.'", "fact": "Some of the most famous sgraffito isn't on pottery at all — it's on buildings. In Prague and parts of Italy, entire palace walls are covered in sgraffito murals where workers scratched through layers of tinted plaster to create giant black-and-white scenes that have survived outdoors for over 500 years.", "factsource": "Scratched Into History"}}, {"num": 4, "icon": "🏔️", "title": "Unit 4 — Ceramic Landscape", "overview": "Building a world in miniature — 360° sculpture. Create a sculptural ceramic landscape: a small world that is pleasing to look at from ALL angles. It can be a real place anywhere on Earth, or a fantasy world — think video game and movie landscapes. Your scene must combine at least ONE man-made structure (bridge, building, well) with at least TWO natural structures (tree, hill, mountain). Solid shapes are allowed here because the piece won't be fired — that makes tall structures easier to stand. Plan your theme FIRST so you have plenty to include, then sketch before you build.", "skills": ["Designing a landscape that reads well from all 360° views", "Including 1+ man-made structure and 2+ natural structures", "Meeting the minimum size: 3 inches wide by 4 inches tall", "Choosing a strong theme before sketching (real place or fantasy world)", "Using solid shapes to support tall elements (no hollowing needed — not kiln-fired)", "Adding people, objects, or animals to bring the scene to life"], "vocab": [{"term": "Landscape", "def": "An artwork depicting natural scenery, often with land, structures, and sky."}, {"term": "Composition", "def": "How the elements of a design are arranged in the space."}, {"term": "Man-made Structure", "def": "A built element such as a bridge, building, or well."}, {"term": "Natural Structure", "def": "A natural element such as a tree, hill, or mountain."}, {"term": "In the Round", "def": "A sculpture meant to be viewed from all sides (360°)."}, {"term": "Theme", "def": "The unifying subject or idea that ties an artwork together."}], "quizzes": [{"q": "What is the minimum size for the landscape?", "opts": ["1in x 1in", "3in wide x 4in tall", "6in x 6in", "12in x 12in"], "ans": 1}, {"q": "How many man-made structures are required, at minimum?", "opts": ["Zero", "One", "Three", "Five"], "ans": 1}, {"q": "How many natural structures are required, at minimum?", "opts": ["One", "Two", "Four", "Ten"], "ans": 1}, {"q": "Why are solid shapes allowed for this project?", "opts": ["They look better", "The piece will not go in the kiln", "They use less clay", "They dry faster"], "ans": 1}, {"q": "From how many views should the landscape look good?", "opts": ["Just the front", "Front and back", "All 360 degrees", "Top only"], "ans": 2}, {"q": "What should you decide BEFORE sketching?", "opts": ["The glaze color", "Your theme", "The kiln temperature", "The price"], "ans": 1}], "rubric": [{"cat": "Required Structures", "ex4": "Includes 1+ man-made AND 2+ natural structures, all clearly identifiable.", "ex2": "Missing a required structure OR some elements are unclear.", "ex0": "No attempt."}, {"cat": "Size & 360° Design", "ex4": "Meets 3x4 inch minimum and is composed to look great from every angle.", "ex2": "Undersized OR has an obvious 'bad side' that wasn't considered.", "ex0": "No attempt."}, {"cat": "Theme & Storytelling", "ex4": "A clear, well-developed theme ties the scene together; details add a story.", "ex2": "Theme is vague OR the scene feels random and unplanned.", "ex0": "No attempt."}, {"cat": "Craftsmanship", "ex4": "Structures are stable, well-built, and neatly finished. Name on the bottom.", "ex2": "Pieces are loose, leaning, or messy OR name is missing.", "ex0": "No attempt."}], "reflections": ["What do you like the most about your project?", "What did you find hard or challenging about this project?", "What would you have done differently or changed about your project?"], "history": {"didyouknow": "Miniature ceramic landscapes have ancient roots in China, where 'penjing' (the ancestor of Japanese bonsai) paired tiny trees with sculpted rock-and-clay scenery to recreate entire mountain ranges in a single tray — a whole world you could hold.", "fact": "Chinese tomb builders made elaborate fired-clay landscape models — complete with houses, towers, farm animals, and tiny figures — to bury with the dead so they'd have a whole world in the afterlife. Some Han Dynasty (200 BCE) ceramic 'house models' are so detailed that archaeologists use them to understand what ancient buildings actually looked like.", "factsource": "Worlds in Clay"}}, {"num": 5, "icon": "🏮", "title": "Unit 5 — Luminary", "overview": "Light, shadow & negative space. Create a luminary at least 4 inches tall with creative, detailed cut-outs designed to hold a tea light. The whole project is about NEGATIVE SPACE — the holes you cut are as important as the clay you keep, because they shape the SHADOWS your luminary will cast when lit from inside. Carvings must be thought-out, not random uneven circles. Every cut must be a CLEAN LINE — no sharp edges or bumpy curves. Taller is easier to carve but heavier, so balance ambition with structural safety. Walls: ½ inch for tall pieces, ¼ inch for 4-inch pieces.", "skills": ["Building a hollow form at least 4 inches tall that houses a tea light", "Keeping walls even — ½ inch for tall pieces, ¼ inch for shorter ones", "Planning a thought-out cut-out design (not random circles!)", "Cutting CLEAN lines — no sharp edges, no bumpy curves", "Using negative space deliberately to shape the cast shadows", "Balancing the number/size of cut-outs against structural strength"], "vocab": [{"term": "Luminary", "def": "A pierced vessel designed to glow when lit from the inside."}, {"term": "Negative Space", "def": "The empty (cut-out) areas that shape light and shadow."}, {"term": "Positive Space", "def": "The solid clay that remains around the cut-outs."}, {"term": "Pierce", "def": "To cut a hole completely through the clay wall."}, {"term": "Structural Integrity", "def": "How well a form holds together and supports its own weight."}, {"term": "Tea Light", "def": "A small candle the luminary is built to safely contain."}], "quizzes": [{"q": "What is the minimum height for the luminary?", "opts": ["1 inch", "4 inches", "8 inches", "12 inches"], "ans": 1}, {"q": "What ideal wall thickness is given for a tall luminary?", "opts": ["Paper-thin", "¼ inch", "½ inch", "2 inches"], "ans": 2}, {"q": "What shapes the shadows a luminary casts?", "opts": ["The glaze color", "The negative space (cut-outs)", "The candle brand", "The clay color"], "ans": 1}, {"q": "What kind of cuts does the project require?", "opts": ["Random circles", "Clean lines, no bumpy curves", "Jagged tears", "No cuts at all"], "ans": 1}, {"q": "What is the trade-off with making a TALLER luminary?", "opts": ["Cheaper but uglier", "Easier to carve but heavier / risk of collapse", "Faster to fire", "Uses less clay"], "ans": 1}, {"q": "What must every luminary be able to house?", "opts": ["A flashlight", "A tea candle", "Water", "A plant"], "ans": 1}], "rubric": [{"cat": "Form & Height", "ex4": "Form is 4 inch+ tall, hollow, even-walled, and safely houses a tea light.", "ex2": "Under 4 inches OR walls are uneven/thin OR won't hold a candle well.", "ex0": "No attempt."}, {"cat": "Cut-Out Design", "ex4": "Cut-outs are thought-out and intentional — a planned pattern, not random.", "ex2": "Cut-outs are random, repetitive, or unplanned.", "ex0": "No attempt."}, {"cat": "Clean Lines", "ex4": "All cuts are clean with crisp edges — no bumpy curves or rough breaks.", "ex2": "Cuts are bumpy, jagged, or have sharp/unfinished edges.", "ex0": "No attempt."}, {"cat": "Light & Negative Space", "ex4": "Negative space is balanced and clearly designed to cast interesting shadows.", "ex2": "Light escapes randomly OR too few/too many holes weaken the effect.", "ex0": "No attempt."}], "reflections": ["What do you like the most about your project?", "What did you find hard or challenging about this project?", "What would you have done differently or changed about your project?"], "history": {"didyouknow": "Pierced 'lantern' ceramics appear all over the world — from Moroccan and Turkish lanterns that throw lacy shadow patterns across entire rooms, to Japanese 'hotaru' (firefly) ware where tiny rice-grain holes let pinpricks of light shine through translucent porcelain.", "fact": "The most extreme version of this technique is Chinese 'rice-grain' porcelain (linglong), where potters cut hundreds of tiny holes, then fill each one with translucent glaze. When fired, the holes seal over but stay see-through — so the finished cup looks solid until you hold it to the light and grains of brightness appear all over it.", "factsource": "Light Through Clay"}}, {"num": 6, "icon": "🌀", "title": "Unit 6 — Wheel Throwing (Partners)", "overview": "The potter's wheel — centering, partnership & your choice. Pair up and learn to throw on the wheel! Centering the clay is the single hardest — and most important — skill in all of ceramics, and you'll tackle it together with a partner: one helps, one throws, then switch. Once you can center and open, YOU decide what to make: a bowl, a cup, a vase, a cylinder — anything thrown. Expect failure at first; even master potters re-center dozens of times. The goal is the SKILL and the collaboration, not perfection on the first pull.", "skills": ["Wedging clay to remove air and align particles before throwing", "Centering clay on the wheel — the foundational wheel skill", "Opening the centered clay and pulling up even walls", "Working WITH a partner: spotting, advice, and taking turns", "Choosing your own form to throw (bowl, cup, vase, cylinder…)", "Trimming a foot and cleaning up the form when leather-hard"], "vocab": [{"term": "Wheel Throwing", "def": "Shaping clay on a spinning potter's wheel."}, {"term": "Centering", "def": "Forcing spinning clay into perfect symmetry — the hardest core skill."}, {"term": "Wedging", "def": "Kneading clay to remove air bubbles and even out moisture."}, {"term": "Opening", "def": "Pressing into centered clay to begin forming the interior."}, {"term": "Pulling", "def": "Drawing the clay walls upward and thinner as the wheel spins."}, {"term": "Trimming", "def": "Carving away excess clay to refine the form and create a foot."}], "quizzes": [{"q": "What is the hardest and most important wheel skill?", "opts": ["Glazing", "Centering", "Trimming", "Signing"], "ans": 1}, {"q": "Why do you wedge clay before throwing?", "opts": ["To color it", "To remove air bubbles and even moisture", "To make it heavier", "To dry it out"], "ans": 1}, {"q": "What does 'opening' the clay mean?", "opts": ["Cutting it in half", "Pressing into centered clay to start the interior", "Removing it from the wheel", "Adding water"], "ans": 1}, {"q": "How are you working in this unit?", "opts": ["Completely alone", "With a partner, taking turns", "In groups of ten", "With the teacher only"], "ans": 1}, {"q": "What can you choose to make once you can center?", "opts": ["Only a flat tile", "Any thrown form — bowl, cup, vase, etc.", "A coil pot only", "Nothing, it's assigned"], "ans": 1}, {"q": "What should you expect when learning the wheel?", "opts": ["Instant perfection", "Failure and lots of re-centering at first", "No clay waste", "To skip wedging"], "ans": 1}], "rubric": [{"cat": "Centering & Technique", "ex4": "Clay is wedged and centered well; walls are opened and pulled with control.", "ex2": "Centering is shaky and walls are uneven, but real effort and progress is shown.", "ex0": "No attempt."}, {"cat": "Partnership", "ex4": "Worked actively with a partner — spotting, advising, and sharing wheel time fairly.", "ex2": "Some partnership, but one person dominated or stayed disengaged.", "ex0": "No attempt."}, {"cat": "Finished Form", "ex4": "Produced a chosen thrown form with even walls and a trimmed, clean finish.", "ex2": "Form is lopsided, thick-walled, or untrimmed but recognizable as thrown.", "ex0": "No attempt."}, {"cat": "Persistence & Work Ethic", "ex4": "Used all wheel time productively and kept trying after collapses. Name on bottom.", "ex2": "Gave up early or was off-task on work days OR name is missing.", "ex0": "No attempt."}], "reflections": ["What do you like the most about your project?", "What did you find hard or challenging about this project?", "What would you have done differently or changed about your project?"], "history": {"didyouknow": "The potter's wheel is over 5,000 years old — one of humanity's first machines. It appeared in Mesopotamia around 3500 BCE, predating the wheel being used for transportation! For a long time, humans spun clay before they ever rolled a cart.", "fact": "Master potters describe centering as almost meditative — you can't force it, you have to relax INTO it. Studies of expert potters show they use less muscle force than beginners, not more. The clay responds to steady, calm pressure; fighting it makes it wobble. It's one of the few skills where trying harder literally makes you worse.", "factsource": "5,000 Years of Spin"}}, {"num": 7, "icon": "🧸", "title": "Unit 7 — Mini Toy Sculpture", "overview": "Big skill, tiny scale — a miniature toy sculpture. Make a TINY toy sculpture: a small-scale character, creature, vehicle, or object like a collectible figure or a toy you'd actually want. Working small is its own challenge — details get fiddly, attachments get fragile, and every tool feels too big. The goal is CRAFTSMANSHIP at miniature scale: clean joins, crisp details, and a finished piece that looks intentional, not like a blob. Think of designer vinyl toys, video-game figurines, and capsule-machine collectibles for inspiration.", "skills": ["Working successfully at a small, controlled scale", "Adding fine details that read clearly even when tiny", "Securely scoring & slipping miniature attachments", "Keeping the piece sturdy despite small, delicate parts", "Designing a toy with clear character or personality", "Finishing neatly — small pieces show every flaw", "Poking an air hole in hollow or thick forms (prevents kiln explosions!)"], "vocab": [{"term": "Scale", "def": "The size of an artwork relative to the real object or to other works."}, {"term": "Miniature", "def": "A small-scale representation of a larger subject."}, {"term": "Craftsmanship", "def": "The skill and care shown in how well a piece is made and finished."}, {"term": "Detail", "def": "The small, fine elements that add realism and interest."}, {"term": "Form", "def": "The three-dimensional shape and volume of an object."}, {"term": "Air Hole", "def": "A small hole poked into a hollow or thick form so trapped air can escape during firing — without it, the piece can explode in the kiln."}], "quizzes": [{"q": "What is the focus of this unit?", "opts": ["The largest piece possible", "Craftsmanship at a tiny scale", "Speed over quality", "Using the most clay"], "ans": 1}, {"q": "Why is working small challenging?", "opts": ["It uses more clay", "Details get fiddly and parts get fragile", "It can't be glazed", "It takes longer to fire"], "ans": 1}, {"q": "What is a 'maquette'?", "opts": ["A glaze type", "A small preliminary model of a larger sculpture", "A kiln tool", "A type of clay"], "ans": 1}, {"q": "How should tiny attachments be joined?", "opts": ["Just pressed on", "Scored and slipped securely", "Glued after firing", "Taped"], "ans": 1}, {"q": "What does 'scale' refer to?", "opts": ["A glaze finish", "The size relative to the real object or other works", "A kiln setting", "The weight of clay"], "ans": 1}, {"q": "Why do small pieces require extra-neat finishing?", "opts": ["They fire hotter", "Every flaw is more visible at small scale", "They use special clay", "They can't be signed"], "ans": 1}, {"q": "Why poke an air hole in a hollow or thick sculpture?", "opts": ["To save clay", "So trapped air can escape and the piece doesn't explode in the kiln", "To make it lighter to carry", "For decoration"], "ans": 1}], "rubric": [{"cat": "Miniature Craftsmanship", "ex4": "Piece is cleanly built at small scale with crisp, intentional details.", "ex2": "Details are mushy or rough, or the piece reads as an undefined blob.", "ex0": "No attempt."}, {"cat": "Character & Design", "ex4": "The toy has clear personality or identity — it's obviously a designed object.", "ex2": "Subject is unclear or generic with little design thought.", "ex0": "No attempt."}, {"cat": "Durability", "ex4": "Small parts are securely attached; the piece can be handled safely.", "ex2": "Parts are loose or fragile and likely to break with handling.", "ex0": "No attempt."}, {"cat": "Finish & Name", "ex4": "Surface is neat and well finished. Name/chop on the bottom.", "ex2": "Finish is sloppy OR signature is missing.", "ex0": "No attempt."}], "reflections": ["What do you like the most about your project?", "What did you find hard or challenging about this project?", "What would you have done differently or changed about your project?"], "history": {"didyouknow": "Humans have been making tiny clay toys for thousands of years. Archaeologists have found small fired-clay animals, dolls, and even miniature wheeled carts in ancient sites from the Indus Valley to Greece — some of the oldest toys ever discovered are made of clay.", "fact": "In the Indus Valley city of Harappa (around 2500 BCE), children played with tiny ceramic toys including animals with movable heads and little carts with working clay wheels. These 4,500-year-old toys are so similar to modern ones that you'd recognize them instantly — proof that 'making a cool little guy' is one of humanity's oldest art forms.", "factsource": "Ancient Toys"}}, {"num": 8, "icon": "✨", "title": "Unit 8 — Free Project", "overview": "Your vision, your proposal — the capstone. This is YOUR project. You've now worked with sculpture, sgraffito, slab cut-outs, the wheel, and miniatures — so propose something that shows what you've learned. FIRST, submit a written proposal: describe your idea, the technique(s) you'll use, your planned size, and WHY you chose it, plus sketches. Once your proposal is approved, you build it. Think like a professional artist applying for a commission — a clear plan is what separates a finished piece from an abandoned lump of clay. Be ambitious, but propose something you can actually finish.", "skills": ["Writing a clear project proposal: idea, technique, size, and reasoning", "Sketching your concept before building", "Getting your proposal approved before starting", "Choosing technique(s) that show off your Ceramics 2 growth", "Managing your own time and process independently", "Delivering a finished piece that matches your approved proposal"], "vocab": [{"term": "Proposal", "def": "A written and sketched plan describing a project before it begins."}, {"term": "Commission", "def": "An artwork made to order, often planned and approved in advance."}, {"term": "Concept", "def": "The central idea or intention behind an artwork."}, {"term": "Technique", "def": "The specific method used to make a piece (coil, slab, wheel, etc.)."}, {"term": "Craftsmanship", "def": "The skill and care shown in how a piece is made and finished."}, {"term": "Self-direction", "def": "Managing your own plan, time, and decisions independently."}], "quizzes": [{"q": "What must you submit BEFORE building?", "opts": ["A finished piece", "A written proposal with sketches", "A glaze sample", "A vocabulary quiz"], "ans": 1}, {"q": "What should the proposal include?", "opts": ["Only a title", "Idea, technique, size, reasoning, and sketches", "Just a drawing", "The price of clay"], "ans": 1}, {"q": "What is a 'commission' in art?", "opts": ["A type of kiln", "An artwork made to order, planned in advance", "A glaze color", "A clay tool"], "ans": 1}, {"q": "What should your free project demonstrate?", "opts": ["The least effort possible", "Your growth and skills from Ceramics 2", "Only one technique you already mastered", "A copy of a classmate's work"], "ans": 1}, {"q": "Why do professional artists write proposals?", "opts": ["It's required by kilns", "To plan a project clearly and get it approved", "To avoid sketching", "To use more clay"], "ans": 1}, {"q": "What separates a finished piece from an abandoned one?", "opts": ["Expensive clay", "A clear plan and self-direction", "A bigger kiln", "More glaze"], "ans": 1}], "rubric": [{"cat": "Proposal & Planning", "ex4": "Submitted a clear written proposal (idea, technique, size, why) WITH sketches before starting.", "ex2": "Proposal is incomplete — missing sketches OR key details.", "ex0": "No attempt."}, {"cat": "Matches Proposal", "ex4": "Finished piece clearly reflects the approved proposal's concept and technique.", "ex2": "Project diverges from the proposal without explanation.", "ex0": "No attempt."}, {"cat": "Growth & Ambition", "ex4": "Project meaningfully applies Ceramics 2 skills and pushes the student's ability.", "ex2": "Project repeats earlier work with little growth OR was rushed.", "ex0": "No attempt."}, {"cat": "Craftsmanship & Name", "ex4": "Piece is skillfully built and neatly finished. Name/chop on the bottom.", "ex2": "Craftsmanship is rushed or messy OR signature is missing.", "ex0": "No attempt."}], "reflections": ["What do you like the most about your project?", "What did you find hard or challenging about this project?", "What would you have done differently or changed about your project?"], "history": {"didyouknow": "Professional ceramic artists rarely just 'start making.' They write proposals to apply for gallery shows, public art commissions, grants, and residencies — describing the work before a single piece exists. Your proposal here mirrors exactly how working artists land paid opportunities.", "fact": "Many famous public artworks existed as nothing but a written proposal and a sketch for YEARS before being built. When an artist proposes a piece, committees often choose between dozens of proposals — meaning the ability to clearly DESCRIBE and PLAN your idea can matter just as much as the ability to make it.", "factsource": "The Artist's Proposal"}}];
const UNIT0={"num": 0, "icon": "🧼", "title":"Safety Unit", "tagline": "Before we touch clay — how we stay safe and keep our studio healthy.", "intro": "Welcome to Ceramics! Before anyone shapes a single piece of clay, every artist in this room has to understand two things: how to stay SAFE, and how to keep our shared studio CLEAN. Clay is wonderful — but dry clay dust contains silica, which is harmful to breathe over time. The good news is that a few simple habits keep the air clean and the studio safe for everyone. As you go through this unit, keep these questions in mind:", "bigq": "What responsibilities come with the freedom to create?  •  Why is clean-up important?", "videos": [{"title": "Studio Safety — Watch First", "youtube": "m7dFLHc-jwc"}, {"title": "Studio Safety — Part 2", "youtube": "PSHQxlbMNpE"}, {"title": "Studio Safety — Part 3", "youtube": "vCcON72KcMA"}], "sections": [{"h": "🫁 Why this matters: silica & your lungs", "p": "Dry clay dust contains crystalline silica. Breathing it in over time can seriously damage your lungs. You can't always see it, but it's there whenever clay dries out and gets stirred into the air. Almost everything we do to clean the studio is really about ONE goal: keeping that dust out of the air we breathe.", "links": [{"label": "OSHA — Crystalline Silica", "url": "https://www.osha.gov/silica-crystalline"}, {"label": "National STEPS Network — Silica Focus Group", "url": "https://www.nationalstepsnetwork.com/silica-focus-group"}]}, {"h": "🤔 The big idea: clean-up isn't a one-time thing", "p": "Cleaning once isn't enough. The real question is: how do you MAINTAIN a clean studio? A safe space isn't something you set up once — it's a routine you keep every single class. Taking responsibility for clean-up is part of earning the freedom to create."}, {"h": "💧 The golden rule: water, not air", "p": "The best way to clean a ceramics studio is with CLEAN WATER. Water keeps the dust from rising so it can't become airborne and get inhaled. Wiping down tools and work surfaces and mopping the floor daily removes clay dust and prevents it from building up. The key word is DAILY — clean your studio every class.", "links": [{"label": "Ceramic School — How to Clean Your Studio", "url": "https://ceramic.school/how-to-clean-your-studio/"}]}, {"h": "✅ Good studio habits", "list": ["Use clean water buckets dedicated only to cleanup.", "Use microfiber cloths instead of sponges.", "Use the table tool kits and return every tool.", "Weigh clay to reduce waste.", "Rotate student jobs and practice the procedures until they're automatic."]}, {"h": "🚫 Things we NEVER do in the studio", "p": "Dusting, sweeping, and vacuuming should NOT be done around clay. With no water to hold the particles down, these methods send silica dust straight into the air. It's especially important not to work over carpet — carpet stores dust the way clothing does. If a rug is used to catch tracked clay, it must be an outdoor mat that gets hosed off regularly; ordinary rugs can't be cleaned properly without professional laundering.", "list": ["Never DRY SWEEP — it throws silica dust into the air.", "Never dust or vacuum dry around clay — same problem, no water.", "Never let clay dry on tables, tools, or the floor — clean it up wet, daily.", "Avoid carpet near clay; use a hose-off outdoor mat if you need one."]}], "vocab": [{"term": "Silica", "def": "A mineral in clay dust that is harmful to breathe over time."}, {"term": "Airborne", "def": "Floating in the air — where dust becomes dangerous to inhale."}, {"term": "Crystalline Silica", "def": "The specific form of silica in clay that damages lungs when inhaled."}, {"term": "Microfiber Cloth", "def": "A cloth that traps dust with water, used instead of sponges."}, {"term": "Maintain", "def": "To keep something clean and safe over time, not just once."}, {"term": "Waste Reduction", "def": "Weighing and reusing clay so less is thrown away."}], "quizzes": [{"q": "Why is dry clay dust dangerous?", "opts": ["It stains clothes", "It contains silica that harms your lungs", "It smells bad", "It attracts bugs"], "ans": 1}, {"q": "What is the BEST way to clean a ceramics studio?", "opts": ["Dry sweeping", "Vacuuming", "Using clean water", "Using a leaf blower"], "ans": 2}, {"q": "Why should you NEVER dry sweep?", "opts": ["It's too slow", "It throws silica dust into the air", "It wears out the broom", "It's against the rules for no reason"], "ans": 1}, {"q": "How often should the studio be cleaned?", "opts": ["Once a month", "Only when it looks dirty", "Every day", "Never"], "ans": 2}, {"q": "Why is carpet a problem near clay?", "opts": ["It's expensive", "It stores dust like clothing does", "It's hard to walk on", "It can't get wet"], "ans": 1}, {"q": "What does water do that makes it the best cleaner?", "opts": ["Keeps dust from becoming airborne", "Makes clay softer", "Smells nice", "Dries faster"], "ans": 0}, {"q": "Which tool do we use instead of sponges?", "opts": ["Paper towels", "Microfiber cloths", "Newspaper", "Our sleeves"], "ans": 1}, {"q": "What does it mean that 'cleaning once isn't enough'?", "opts": ["You only clean at year's end", "A clean studio must be MAINTAINED every class", "Cleaning is optional", "Only the teacher cleans"], "ans": 1}]};

function _shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function makeQuizOrder(quizzes){
  const order=_shuffle(quizzes.map((_,i)=>i));
  const optOrder={};
  quizzes.forEach((q,i)=>{optOrder[i]=_shuffle(q.opts.map((_,j)=>j));});
  return {order,optOrder};
}
function ensureOrder(qs,quizzes){
  if(!qs.order||!qs.optOrder||qs.order.length!==quizzes.length){const o=makeQuizOrder(quizzes);qs.order=o.order;qs.optOrder=o.optOrder;}
}

const LOCK_KEY=PREFIX+":teacher:locks";

const ALL_WEEKS=[0,1,2,3,4,5,6,7,8];

let student=null,activeWk=null,scores={},quizState={},tabState={},submitted={},uploads={};
let lockState={};
let saveTimer=null;

function skey(s,w,f){return PREFIX+":"+s+":w"+w+":"+f;}
async function cloudSave(s,w,f,val){try{await window.storage.set(skey(s,w,f),JSON.stringify(val),true);}catch(e){}}
async function cloudLoad(s,w,f){try{const r=await window.storage.get(skey(s,w,f),true);return r?JSON.parse(r.value):null;}catch(e){return null;}}
function lsKey(s,w,f){return "at_"+btoa(encodeURIComponent(s))+"_w"+w+"_"+f;}
function lsSave(s,w,f,v){try{localStorage.setItem(lsKey(s,w,f),JSON.stringify(v));}catch(e){}}
function lsLoad(s,w,f){try{const r=localStorage.getItem(lsKey(s,w,f));return r?JSON.parse(r):null;}catch(e){return null;}}

async function loadLocks(){
  try{
    const r=await window.storage.get(LOCK_KEY,true);
    const saved=r?JSON.parse(r.value):{};
    // Unlocked by default; only locked if teacher explicitly set false.
    lockState={};ALL_WEEKS.forEach(w=>{lockState[w]=saved[w]!==false;});
  }catch(e){lockState={};ALL_WEEKS.forEach(w=>{lockState[w]=true;});}
}
function isUnlocked(wnum){return previewMode?true:!!lockState[wnum];}

function compressImage(file){
  return new Promise((resolve)=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const maxSz=800;
        let w=img.width,h=img.height;
        if(w>maxSz||h>maxSz){if(w>h){h=Math.round(h*maxSz/w);w=maxSz;}else{w=Math.round(w*maxSz/h);h=maxSz;}}
        const canvas=document.createElement("canvas");
        canvas.width=w;canvas.height=h;
        canvas.getContext("2d").drawImage(img,0,0,w,h);
        resolve({data:canvas.toDataURL("image/jpeg",0.7),name:file.name});
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

async function loadState(s){
  scores={};submitted={};quizState={};uploads={};rubfb={};
  {const mu=lsLoad(s,"makeup","uploads")||await cloudLoad(s,"makeup","uploads");if(mu)uploads["makeup"]=mu;}
  // Unit 0 safety quiz state
  {const qs0=lsLoad(s,0,"quizstate")||await cloudLoad(s,0,"quizstate");quizState[0]=qs0||{attempts:0,bestScore:0,currentAnswers:{},done:false};}
  for(const w of weeks){
    const sc=lsLoad(s,w.num,"scores")||await cloudLoad(s,w.num,"scores");if(sc)scores[w.num]=sc;
    const rfb=lsLoad(s,w.num,"rubfb")||await cloudLoad(s,w.num,"rubfb");if(rfb)rubfb[w.num]=rfb;
    const sub=lsLoad(s,w.num,"sub")||await cloudLoad(s,w.num,"sub");if(sub)submitted[w.num]=true;
    const qs=lsLoad(s,w.num,"quizstate")||await cloudLoad(s,w.num,"quizstate");
    quizState[w.num]=qs||{attempts:0,bestScore:0,currentAnswers:{},done:false};
    const up=lsLoad(s,w.num,"uploads")||await cloudLoad(s,w.num,"uploads");
    if(up)uploads[w.num]=up;else uploads[w.num]=[];
  }
}

function getScore(n){
  const w=weeks.find(x=>x.num===n);if(!w)return 0;
  const s=scores[n]||{};
  return w.rubric.reduce((sum,r)=>{const v=s[r.cat];return sum+(v!=null?v:0);},0);
}
function quizPassed(n){const w=weeks.find(x=>x.num===n);if(!w)return false;const qs=quizState[n]||{};if(!qs.done)return false;return Math.round(getQuizCorrect(n)/w.quizzes.length*100)>=PASS_PCT;}
function getQuizCorrect(n){
  const w=weeks.find(x=>x.num===n);if(!w)return 0;
  const qs=quizState[n]||{};const ans=qs.currentAnswers||{};
  return w.quizzes.reduce((sum,q,i)=>sum+(ans[i]===q.ans?1:0),0);
}
function showSaving(msg){const el=document.getElementById("saving-ind");if(el){el.textContent=msg;clearTimeout(saveTimer);if(msg)saveTimer=setTimeout(()=>{if(el)el.textContent="";},2000);}}
function render(){const app=document.getElementById("app");if(!student){renderLogin(app);return;}renderMain(app);}

let rubfb={};
let pendingStudent=null,pinEntry="",previewMode=false;
function renderLogin(app){
  app.innerHTML=`<div class="login-card">
    <h2>🏺 Ceramics 2</h2>
    <p>John Glenn High School<br>Select your name, then enter your 4-digit PIN to access your lessons, rubrics, quizzes, and project uploads.</p>
    <select id="ss"><option value="">— Choose your name —</option>${STUDENTS.map(s=>`<option value="${s}">${s}</option>`).join("")}</select>
    <button class="btn" id="lb" disabled onclick="goToPin()">Next →</button>
    <button class="teacher-preview-link" onclick="startPreview()">👁️ Teacher preview</button>
  </div>`;
  document.getElementById("ss").onchange=e=>{document.getElementById("lb").disabled=!e.target.value;};
}

async function startPreview(){
  previewMode=true;student="__PREVIEW__";pendingStudent=null;pinEntry="";
  document.getElementById("app").innerHTML=`<div style="text-align:center;padding:3rem;color:#7F77DD;font-size:14px">Loading preview…</div>`;
  await loadLocks();
  await loadState(student);
  if(typeof loadWorksheets==="function"){await loadWorksheets(student);}
  activeWk=null;render();
}

function goToPin(){
  const v=document.getElementById("ss").value;if(!v)return;
  pendingStudent=v;pinEntry="";renderPinPad();
}

function renderPinPad(){
  const app=document.getElementById("app");
  app.innerHTML=`<div class="login-card pin-wrap">
    <h2>🏺 Ceramics 2</h2>
    <div class="pin-name">👤 ${pendingStudent}</div>
    <div class="pin-sub">Enter your 4-digit PIN</div>
    <div class="pin-dots">${[0,1,2,3].map(i=>`<div class="pin-dot${i<pinEntry.length?" filled":""}"></div>`).join("")}</div>
    <div class="pin-pad">
      ${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="pin-key" onclick="pinPress('${n}')">${n}</button>`).join("")}
      <button class="pin-key" onclick="pinBack()">⌫</button>
      <button class="pin-key" onclick="pinPress('0')">0</button>
      <button class="pin-key" onclick="pinClear()">✕</button>
    </div>
    <div class="pin-err" id="pin-err"></div>
    <button class="pin-back" onclick="pinCancel()">← Not you? Go back</button>
  </div>`;
}
function pinPress(d){
  if(pinEntry.length>=4)return;
  pinEntry+=d;renderPinPad();
  if(pinEntry.length===4)setTimeout(verifyPin,150);

function answerQuiz(wnum,qIdx,chosenOrig){
  const qs=quizState[wnum];if(!qs||qs.done)return;
  qs.currentAnswers[qIdx]=chosenOrig;
  const w=weeks.find(x=>x.num===wnum);
  const allAnswered=w.quizzes.every((_,i)=>qs.currentAnswers[i]!=null);
  document.querySelectorAll(`.qopt-${wnum}-${qIdx}`).forEach(o=>{const oj=parseInt(o.dataset.orig,10);o.disabled=true;if(oj===w.quizzes[qIdx].ans)o.classList.add("right");else if(oj===chosenOrig)o.classList.add("wrong");});
  const answered=Object.keys(qs.currentAnswers).length;
  const pf=document.getElementById("qprog-fill-"+wnum);const pl=document.getElementById("qprog-lbl-"+wnum);
  if(pf)pf.style.width=Math.round(answered/w.quizzes.length*100)+"%";
  if(pl)pl.textContent=answered+" / "+w.quizzes.length+" answered";
  if(allAnswered){
    qs.done=true;const correct=getQuizCorrect(wnum);qs.bestScore=Math.max(qs.bestScore||0,correct);
    lsSave(student,wnum,"quizstate",qs);cloudSave(student,wnum,"quizstate",qs);showSaving("Quiz saved…");
    renderQuizResult(wnum,w,correct);
    renderGrid();
  }
}

function renderQuizResult(wnum,w,correct){
  const total=w.quizzes.length;const pct=Math.round(correct/total*100);
  const passed=pct>=PASS_PCT;
  const cls=passed?"pass":"fail";
  const msg=passed?"You passed! 🎉 (80%+)":`You need ${PASS_PCT}% to pass. You got ${pct}% — tap Retake to try again.`;
  const resEl=document.getElementById("quiz-result-"+wnum);
  if(resEl){resEl.style.display="block";resEl.innerHTML=`<div class="result-score">${correct} / ${total}</div><div class="result-label">${pct}% correct &middot; Attempt ${qsAttemptNum(wnum)}</div><div class="result-msg ${cls}">${msg}</div>`;resEl.className="quiz-result "+cls;}
  const rb=document.getElementById("retake-btn-"+wnum);const rl=document.getElementById("retake-lbl-"+wnum);
  if(rb&&rl){rb.disabled=passed;rl.textContent=passed?"(passed ✓)":"(unlimited retakes)";}
}
function qsAttemptNum(wnum){const qs=quizState[wnum]||{};return (qs.attempts||0)+1;}

function retakeQuiz(wnum){
  const qs=quizState[wnum];if(!qs)return;
  if(quizPassed(wnum))return;
  qs.attempts=(qs.attempts||0)+1;qs.currentAnswers={};qs.done=false;
  const w=weeks.find(x=>x.num===wnum);const o=makeQuizOrder(w.quizzes);qs.order=o.order;qs.optOrder=o.optOrder;
  lsSave(student,wnum,"quizstate",qs);cloudSave(student,wnum,"quizstate",qs);
  renderQuizTab(wnum,w);
}

async function handleFiles(files,wnum){
  if(!uploads[wnum])uploads[wnum]=[];
  const remaining=MAX_IMAGES-uploads[wnum].length;
  const toProcess=Array.from(files).slice(0,remaining);
  showSaving("Uploading…");
  for(const f of toProcess){
    const compressed=await compressImage(f);
    uploads[wnum].push(compressed);
  }
  lsSave(student,wnum,"uploads",uploads[wnum]);
  await cloudSave(student,wnum,"uploads",uploads[wnum]);
  showSaving("Uploaded ✓");
  refreshPreview(wnum);
}

function handleDrop(e,wnum){
  e.preventDefault();
  document.getElementById("dropzone-"+wnum)?.classList.remove("drag-over");
  handleFiles(e.dataTransfer.files,wnum);
}

function removeImage(wnum,idx){
  uploads[wnum].splice(idx,1);
  lsSave(student,wnum,"uploads",uploads[wnum]);
  cloudSave(student,wnum,"uploads",uploads[wnum]);
  refreshPreview(wnum);
}

function refreshPreview(wnum){
  const grid=document.getElementById("preview-"+wnum);
  const readonly=!!submitted[wnum];
  const imgs=uploads[wnum]||[];
  if(grid){
    grid.innerHTML=imgs.map((img,i)=>`<div class="preview-item" id="pv-${wnum}-${i}">
      <img src="${img.data}" alt="${img.name}">
      <div class="preview-label">${img.name}</div>
      ${!readonly?`<button class="preview-remove" onclick="removeImage('${wnum}',${i})">✕</button>`:""}
    </div>`).join("");
  }
  // update count
  const sec=document.querySelector(`#wpanel .upload-section`);
  const countEl=sec?.querySelector(".upload-count");
  if(countEl)countEl.textContent=imgs.length>0?imgs.length+" / "+MAX_IMAGES+" photo"+(imgs.length===1?"":"s")+" uploaded":"";
  // hide dropzone if max reached
  const dz=document.getElementById("dropzone-"+wnum);
  if(dz)dz.style.display=imgs.length>=MAX_IMAGES?"none":"block";
}

function escapeHtml(str){return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function openExLightbox(wnum,idx){
  const ex=WEEK_EXAMPLES[wnum]||WEEK_EXAMPLES[String(wnum)]||[];
